spring:
  application:
    name: maple-hush-admin
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  jackson:
    time-zone: GMT+8
    date-format: "yyyy-MM-dd HH:mm:ss"
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    init-sqls: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: never

app:
  oss:
    enabled: ${OSS_ENABLED:false}
    region: ${OSS_REGION:cn-beijing}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:maple-hush}
    domain: ${OSS_DOMAIN:https://maple-hush.oss-cn-beijing.aliyuncs.com}
    prefix: ${OSS_PREFIX:vben-admin-img}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  dept:
    code-prefix: DEPT_
  docs:
    enabled: ${API_DOCS_ENABLED:false}
  auth:
    issuer: maple-hush-admin
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-path: /api/auth
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    allowed-origins:
      - ${APP_AUTH_ALLOWED_ORIGIN}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

mybatis-plus:
  mapper-locations: classpath*:mapper/system/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
