services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL:?Set DB_URL to the MySQL JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:?Set SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64}
      APP_AUTH_ALLOWED_ORIGIN: ${APP_AUTH_ALLOWED_ORIGIN:?Set APP_AUTH_ALLOWED_ORIGIN}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
      APP_BOOTSTRAP_ADMIN_AUTO_ENABLED: ${APP_BOOTSTRAP_ADMIN_AUTO_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
